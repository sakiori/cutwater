# cargo-about configuration: `cargo run --locked -p xtask -- notices <dir>
# <target>` writes the third-party notices that every release archive and npm
# platform package carries, the crates' from this file and the template
# about.hbs.

# The licenses of the crates the executable links, in order of preference: of
# a crate offered under several licenses, the notices carry the first one
# listed here. deny.toml allows the same licenses, which xtask checks.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# The release targets: a crate only another platform uses is not linked.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Build scripts' dependencies and dev-dependencies are not part of the
# executable. Procedural macros are not either, but cargo-about cannot tell
# them apart, so their notices are carried too.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# xtask is never published nor shipped.
private = { ignore = true }
