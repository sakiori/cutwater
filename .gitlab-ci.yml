# The pipeline of cutwater on GitLab.com. A merge request pipeline checks the
# OpenSpec specification; the jobs that build, test and release the tool come
# with its code.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/
  # A newer commit never cancels a pipeline: the release commit's pipeline is
  # the only one that publishes its release.
  auto_cancel:
    on_new_commit: none

variables:
  NODE_IMAGE: node:24.22.2-trixie-slim@sha256:54f84b4cf8432b21aaffd5d3ce8d41e12cea0d10d33c09d2f3c9879d49d6b446

default:
  tags:
    - sakiori-oss-linux

# The OpenSpec CLI and its whole dependency tree, as
# .gitlab/openspec/package-lock.json pins them with their integrity hashes;
# none of them needs an install script.
openspec:
  image: $NODE_IMAGE
  variables:
    # The CLI reports usage to its authors unless told not to.
    OPENSPEC_TELEMETRY: "0"
  script:
    - npm ci --prefix .gitlab/openspec --ignore-scripts --no-audit --no-fund
    - .gitlab/openspec/node_modules/.bin/openspec validate --all --strict --no-interactive
