[package]
name = "cutwater"
version = "0.1.0"
edition = "2024"
# The oldest toolchain that builds the crate with the locked dependencies
# (serde-saphyr needs 1.89); the msrv job in CI builds with it.
rust-version = "1.89"
license = "MIT"
repository = "https://gitlab.com/sakiori-oss/cutwater"
description = "Releases the packages of a repository through one bot-maintained merge request, from reviewed changeset files"
readme = "README.md"
keywords = ["release", "changeset", "monorepo", "gitlab", "versioning"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/", "/Cargo.lock", "/LICENSE", "/README.md"]

# cargo-binstall installs the release archive of the target instead of
# building the crate: cutwater-<version>-<target>.tar.gz with the executable
# at its root (.gitlab/scripts/build-release.sh), through the permanent link
# of the GitLab Release to it.
[package.metadata.binstall]
pkg-url = "{ repo }/-/releases/{ version }/downloads/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
configparser = "3.3.0"
dialoguer = { version = "0.12.0", default-features = false }
flate2 = "1.1.11"
gitlab = { version = "0.1905.0", default-features = false, features = ["client_api", "client_pem"] }
gix-validate = "0.13.1"
globset = "0.4.21"
ignore = "0.4.34"
jsonc-parser = { version = "0.34.0", features = ["cst"] }
nodejs-semver = "7.0.0"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
petname = { version = "3.2.0", default-features = false, features = ["default-rng", "default-words"] }
roxmltree = "0.21.2"
schemars = "1.2.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tempfile = "3.27.0"
toml = "1.1.8"
toml_edit = "0.25.19"
walkdir = "2.5.0"
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2.2.2"
expect-test = "1.5.1"
form_urlencoded = "1.2.2"
mockito = "1.7.2"
predicates = "3.1.4"

# `xtask` holds development tasks, such as generating the third-party notices
# of the release archives, so that their dependencies stay out of the crate.
[workspace]
members = ["xtask"]
