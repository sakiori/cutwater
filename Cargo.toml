[package]
name = "cutwater"
version = "0.1.0"
edition = "2024"
# The oldest toolchain that builds the crate with the locked dependencies
# (serde-saphyr needs 1.89); the msrv job in CI builds with it.
rust-version = "1.89"
license = "MIT"
repository = "https://gitlab.com/sakiori-oss/cutwater"
description = "Releases the packages of a repository through one bot-maintained merge request, from reviewed changeset files"
readme = "README.md"
keywords = ["release", "changeset", "monorepo", "gitlab", "versioning"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1.0.104"
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
configparser = "3.3.0"
dialoguer = { version = "0.12.0", default-features = false }
gix-validate = "0.13.1"
globset = "0.4.21"
ignore = "0.4.34"
petname = { version = "3.2.0", default-features = false, features = ["default-rng", "default-words"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
expect-test = "1.5.1"
predicates = "3.1.4"
tempfile = "3.27.0"
