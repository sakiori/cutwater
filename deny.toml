# cargo-deny configuration: `cargo deny check` checks the dependency graph for
# security advisories, licenses, banned or duplicated crates and sources.

[graph]
# The platforms the tool is built for: Linux, which CI runs on, and macOS.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Every RustSec advisory fails the check, for any crate of the graph: a
# vulnerability, and an unmaintained or unsound crate whether the crate
# depends on it directly or through another crate. A yanked version in the
# lockfile fails it too, as far as cargo's cached index entries tell: run
# `cargo update --dry-run` first, as CI does, so that they are current.
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# The licenses of the dependency tree, all compatible with the MIT license of
# the tool.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
